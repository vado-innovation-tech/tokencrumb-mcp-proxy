# TokenCrumb custom build snapshot: local version, publication disabled,
# and omitted upstream example/test/benchmark targets and dev dependencies.
# See README.md and tokencrumb.patch for provenance and changes.
# THIS FILE IS AUTOMATICALLY GENERATED BY CARGO
#
# When uploading crates to the registry Cargo will automatically
# "normalize" Cargo.toml files for maximal compatibility
# with all versions of Cargo and also rewrite `path` dependencies
# to registry (e.g., crates.io) dependencies.
#
# If you are reading this file be aware that the original Cargo.toml
# will likely look very different (and much more reasonable).
# See Cargo.toml.orig for the original contents.

[package]
edition = "2018"
name = "biscuit-auth"
version = "6.0.0-tokencrumb.1"
publish = false
authors = ["Geoffroy Couprie <contact@geoffroycouprie.com>"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "an authorization token with decentralized verification and offline attenuation"
homepage = "https://github.com/biscuit-auth/biscuit"
documentation = "https://docs.rs/biscuit-auth"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/biscuit-auth/biscuit-rust"
resolver = "2"

[features]
bwk = [
    "chrono",
    "serde",
]
datalog-macro = ["biscuit-quote"]
default = [
    "regex-full",
    "datalog-macro",
    "pem",
]
docsrs = []
pem = [
    "ed25519-dalek/pem",
    "ed25519-dalek/pkcs8",
]
regex-full = [
    "regex/perf",
    "regex/unicode",
]
serde-error = [
    "serde",
    "biscuit-parser/serde-error",
]
uuid = ["dep:uuid"]
wasm = ["wasm-bindgen"]

[lib]
name = "biscuit_auth"
path = "src/lib.rs"

[dependencies.base64]
version = "0.13.0"

[dependencies.biscuit-parser]
version = "0.2.0"

[dependencies.biscuit-quote]
version = "0.3.0"
optional = true

[dependencies.chrono]
version = "0.4.26"
features = ["serde"]
optional = true
default-features = false

[dependencies.ecdsa]
version = "0.16.9"
features = [
    "signing",
    "verifying",
    "pem",
    "alloc",
    "pkcs8",
    "serde",
]

[dependencies.ed25519-dalek]
version = "2.0.0"
features = [
    "rand_core",
    "zeroize",
]

[dependencies.elliptic-curve]
version = "0.13.8"
features = ["pkcs8"]

[dependencies.getrandom]
version = "0.2.15"

[dependencies.hex]
version = "0.4"

[dependencies.nom]
version = "7"
features = ["std"]
default-features = false

[dependencies.p256]
version = "0.13.2"

[dependencies.pkcs8]
version = "0.9.0"

[dependencies.prost]
version = "0.10"

[dependencies.prost-types]
version = "0.10"

[dependencies.rand]
version = "0.8"

[dependencies.rand_core]
version = "^0.6"

[dependencies.regex]
version = "1.5"
features = ["std"]
default-features = false

[dependencies.serde]
version = "1.0.132"
features = ["derive"]
optional = true

[dependencies.serde_json]
version = "1.0.117"

[dependencies.sha2]
version = "^0.9"

[dependencies.thiserror]
version = "1"

[dependencies.time]
version = "0.3.7"
features = [
    "formatting",
    "parsing",
]

[dependencies.uuid]
version = "1"
optional = true

[dependencies.wasm-bindgen]
version = "0.2"
optional = true

[dependencies.zeroize]
version = "1.5"
default-features = false
